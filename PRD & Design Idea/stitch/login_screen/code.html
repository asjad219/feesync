<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FeeSync - Login</title>

                      "error-container": "#93000a",
                      "inverse-primary": "#0053db",
                      "secondary": "#d0bcff",
                      "on-error-container": "#ffdad6",
                      "on-tertiary-container": "#ffede6",
                      "inverse-on-surface": "#2f2f3d",
                      "error": "#ffb4ab",
                      "background": "#12121f",
                      "surface-container": "#1e1e2c",

                      "on-secondary": "#3c0091",

<style>
        body {
            background-color: #0d0d1a;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-surface {
            background: rgba(30, 30, 44, 0.8);
            backdrop-filter: blur(16px);
        }
        .signature-gradient {
            background: linear-gradient(135deg, #2563eb 0%, #571bc1 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest text-on-surface min-h-screen flex flex-col items-center justify-center p-6">
<!-- Background Decorative Elements -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary-container/10 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-secondary-container/10 blur-[120px]"></div>
</div>
<!-- Login Container -->
<main class="w-full max-w-[480px] z-10">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-10">
<div class="w-16 h-16 signature-gradient rounded-xl flex items-center justify-center mb-4 shadow-[0px_4px_24px_0px_rgba(37,99,235,0.3)]">
<span class="material-symbols-outlined text-white text-3xl" data-icon="sync">sync</span>
</div>
<h1 class="font-headline font-extrabold text-3xl tracking-tight text-on-surface">FeeSync</h1>
</div>
<!-- Glassmorphic Card -->
<div class="glass-surface p-8 md:p-12 rounded-xl shadow-[0px_8px_32px_0px_rgba(0,0,0,0.5)]">
<div class="mb-8">
<h2 class="font-headline font-bold text-2xl text-on-surface mb-2">Welcome Back</h2>
<p class="font-body text-on-surface-variant">Sign in to manage your financial ecosystem.</p>
</div>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label text-sm font-medium text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="w-full bg-surface-container-highest/50 border-none rounded-lg py-4 pl-12 pr-4 text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary focus:bg-surface-container-highest transition-all duration-200" id="email" placeholder="name@institution.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="font-label text-sm font-medium text-on-surface-variant" for="password">Password</label>
<a class="text-xs font-semibold text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="w-full bg-surface-container-highest/50 border-none rounded-lg py-4 pl-12 pr-12 text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary focus:bg-surface-container-highest transition-all duration-200" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-4 flex items-center text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="w-full signature-gradient text-white font-headline font-bold py-4 rounded-xl shadow-[0px_4px_24px_0px_rgba(37,99,235,0.2)] hover:shadow-[0px_4px_32px_0px_rgba(37,99,235,0.4)] active:scale-[0.98] transition-all duration-200 mt-4" type="submit">
                    Login
                </button>
</form>
<!-- Social Login Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/20"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-surface-container px-4 text-on-surface-variant font-label tracking-widest">or continue with</span>
</div>
</div>
<!-- Social Buttons -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 bg-surface-container-low hover:bg-surface-container-high py-3 rounded-lg border border-outline-variant/10 transition-colors">
<img alt="Google" class="w-5 h-5" data-alt="minimalist google logo icon on transparent background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD8OnL_XG_ZbHEiXOBkfX40LJRw0dKBXCncau-UDD6zxtmF8ZAvnAFl0u72xjz42c5BtVlWdGPCVrSB2Ut-6SX7YwmP7w0Vj_xSNBSyZptHjBTZnbFeP1n3ATPnOxexOBeZCydpi3rbNeHFhAf7N_j3Sr-HT7zFy0kkA7BDGNqg0wrdzbVF8bCgL2CtlkvEEyWlUcGOg52_v3t1b8M8rvSEo9RElBn-E9kqT2P3dsSb1Ha9ZUGIKqno2CMC7zJlKKlljip1cFwKeUrH"/>
<span class="font-label text-sm">Google</span>
</button>
<button class="flex items-center justify-center gap-3 bg-surface-container-low hover:bg-surface-container-high py-3 rounded-lg border border-outline-variant/10 transition-colors">
<span class="material-symbols-outlined text-on-surface" data-icon="fingerprint">fingerprint</span>
<span class="font-label text-sm">Biometric</span>
</button>
</div>
</div>
<!-- Footer -->
<p class="mt-8 text-center font-body text-on-surface-variant">
            Don't have an account? 
            <a class="text-secondary font-bold hover:underline underline-offset-4 ml-1" href="#">Sign Up</a>
</p>
</main>
<!-- Trust Indicator -->
<footer class="mt-12 text-center">
<div class="flex items-center justify-center gap-6 opacity-40 grayscale hover:grayscale-0 transition-all duration-500">
<span class="material-symbols-outlined" data-icon="security">security</span>
<span class="material-symbols-outlined" data-icon="verified_user">verified_user</span>
<span class="material-symbols-outlined" data-icon="encrypted">encrypted</span>
</div>
<p class="mt-4 text-[10px] uppercase tracking-[0.2em] text-on-surface-variant/40">Secure Enterprise Financial Gateway</p>
</footer>
</body></html>
