            color: #e3e0f4;

            background: rgba(30, 30, 44, 0.8);

<body class="bg-surface-container-lowest min-h-screen flex flex-col items-center justify-center overflow-hidden">
<!-- Background Decorative Element -->
<div class="absolute top-[-10%] left-[-10%] w-[60%] h-[60%] bg-primary-container/10 rounded-full blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-secondary-container/10 rounded-full blur-[120px] pointer-events-none"></div>
<main class="relative z-10 w-full max-w-md px-6 flex flex-col items-center">
<!-- Illustration Container -->
<div class="w-full aspect-square mb-12 relative">
<div class="absolute inset-0 bg-gradient-to-tr from-primary-container/20 to-secondary-container/20 rounded-3xl rotate-3 scale-95 opacity-50"></div>
<div class="absolute inset-0 bg-gradient-to-bl from-primary-container/10 to-secondary-container/30 rounded-3xl -rotate-3 scale-90 opacity-40"></div>
<img alt="Modern financial illustration" class="w-full h-full object-cover rounded-3xl shadow-2xl relative z-10" data-alt="stylized 3D rendering of glass floating geometric financial icons, coins, and data graphs in deep blue and purple aesthetic on dark background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCqyD2NadE1B_dmPYIOCv17rZG6748M1ENMquRaxe-Lf-5GAyspjxS2tiVjsTPf16lNNojDpnHrQ49XUDXESSVoiXULEqyal13HXbQdKTzbfxhctlZoH2aM_j1cxJVIU_gOsyiC0F8Eb5LvyO1Hr_9kpf9TvwX8ZwH9ozFK3UZl5JoouFPz6EJ2toiWzt9lPJBGIx4AkkbsSfAJZKPyR2UdldnpreBnhqUQlPGgGcWyyWdHKUM0RLdtwxRe3ss67pWGho9Ipcx0HNzg"/>
</div>
<!-- Glassmorphic Content Card -->
<div class="glass-card w-full p-8 rounded-3xl shadow-[0px_8px_32px_0px_rgba(0,0,0,0.4)] border border-outline-variant/10">
<header class="text-center mb-8">
<h1 class="font-headline text-3xl font-bold tracking-tight text-on-surface mb-3">
                    Simplify Fee Collection
                </h1>
<p class="font-body text-on-surface-variant text-base leading-relaxed">
                    Manage your institution's finances with ease and precision.
                </p>
</header>
<!-- Navigation Progress -->
<div class="flex justify-center items-center space-x-3 mb-10">
<div class="h-1.5 w-8 rounded-full bg-gradient-to-r from-primary-container to-secondary-container"></div>
<div class="h-1.5 w-2 rounded-full bg-surface-container-highest"></div>
<div class="h-1.5 w-2 rounded-full bg-surface-container-highest"></div>
</div>
<!-- Action Button -->
<button class="w-full py-4 px-6 rounded-2xl bg-gradient-to-br from-primary-container to-secondary-container text-white font-headline font-bold text-lg flex items-center justify-center space-x-2 shadow-lg shadow-primary-container/20 active:scale-[0.98] transition-all">
<span>Next</span>
<span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Skip Option -->
<button class="w-full mt-6 text-center text-on-surface-variant font-label text-sm hover:text-on-surface transition-colors">
                Skip for now
            </button>
</div>
<!-- Brand Footer -->
<div class="mt-12 opacity-50 flex items-center space-x-2">
<div class="w-6 h-6 rounded-lg bg-gradient-to-br from-primary-container to-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-[14px] text-white" data-icon="sync" style="font-variation-settings: 'FILL' 1;">sync</span>
</div>
