name: feesync_mobile
description: "FeeSync - School Fee Management Mobile App"
publish_to: 'none'
version: 1.0.4+6

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Backend
  supabase_flutter: ^2.8.1

  # Navigation
  go_router: ^14.8.1

  # UI Components
  flutter_slidable: ^3.1.2
  fl_chart: ^0.64.0

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.2
  google_fonts: ^8.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.5
  share_plus: ^13.1.0
  firebase_core: ^4.10.0
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.3.1

  # Billing — Google Play In-App Purchases
  in_app_purchase: ^3.2.0

  # Local state cache
  shared_preferences: ^2.3.2

  # Network connectivity
  connectivity_plus: ^6.1.4

  # Google Sign-In and Google Drive APIs
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.1

  # Native File Dialogs (Save File directly)
  flutter_file_dialog: ^3.0.2
  crypto: ^3.0.7
  flutter_svg: ^2.3.0
  font_awesome_flutter: ^11.0.0
  uuid: ^4.5.3
  sqflite: ^2.4.2+1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#030a36"
  adaptive_icon_foreground: "assets/logo_foreground.png"
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"

flutter:
  uses-material-design: true
  assets:
    - assets/
