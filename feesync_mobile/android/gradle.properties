org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.ndkVersion=28.2.13676358
flutter.ndkVersion=28.2.13676358

# Disable deprecated armeabi ABI support
android.ndk.disableDeprecatedAbis=true

# Restrict to modern ABIs only - prevents jni package from building armeabi
systemProp.include_native_armeabi=false
android.abs.include=armeabi-v7a,arm64-v8a,x86_64
